<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClaimDesk · Employee expense app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════
   CLAIMDESK DESIGN SYSTEM · v2.0 — "Clear Ledger"
   Direction: light fintech. Cool-gray canvas, white cards with soft
   layered shadows, royal-blue gradient hero, pill buttons and pill
   segments, tinted smart-check (AI insight) cards, circular avatars.
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* ── Color · surfaces + ink ───────────────────── */
  --paper:        #F2F4F8;   /* app background                 */
  --paper-raised: #FFFFFF;   /* cards, sheets                  */
  --paper-sunken: #F5F7FA;   /* wells, tracks, disabled fills  */
  --ink:          #101828;
  --ink-70: rgba(16,24,40,.72);
  --ink-55: #667085;
  --ink-40: #98A2B3;
  --ink-25: #C6CEDA;
  --line:      #EAECF2;      /* hairline dividers   */
  --line-mid:  #D5DBE4;      /* input borders       */

  /* ── Color · brand + semantic ─────────────────── */
  --accent:      #2D5FF0;    /* royal blue · primary           */
  --accent-deep: #1E4AD1;
  --accent-tint: #EBF0FE;
  --accent-grad: linear-gradient(135deg,#4B7BF7 0%,#2D5FF0 55%,#2049CE 100%);
  --on-accent:   #FFFFFF;
  --ok:      #12A150;  --ok-tint:    #E7F6EE;
  --warn:    #B25E09;  --warn-tint:  #FCF2E3;
  --danger:  #DE4444;  --danger-tint:#FDEDED;
  --violet:  #7A5AF8;  --violet-tint:#F1EEFE;   /* smart-check accent */
  --focus-ring: #2D5FF0;

  /* ── Type ─────────────────────────────────────── */
  --font-ui:      'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --font-display: var(--font-ui);
  --fs-micro: 10.5px;
  --fs-caption: 11.5px;
  --fs-body-s: 13px;
  --fs-body: 14.5px;
  --fs-title: 17px;
  --fs-h2: 21px;
  --fs-h1: 26px;
  --fs-num-l: 38px;
  --track-caps: .07em;

  /* ── Space (4pt) · radius · borders ───────────── */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px;
  --r: 14px;            /* generic surface radius (inline uses) */
  --r-card: 18px;
  --r-input: 12px;
  --r-pill: 999px;
  --r-sheet: 24px;
  --hairline: 1px solid var(--line);

  /* ── Elevation · motion ───────────────────────── */
  --shadow-raised: 0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.06);
  --shadow-pop:    0 4px 10px rgba(16,24,40,.08), 0 16px 40px rgba(16,24,40,.12);
  --shadow-sheet:  0 -12px 40px rgba(16,24,40,.18);
  --ease: cubic-bezier(.32,.72,.24,1);
  --t-fast: 140ms; --t-med: 220ms; --t-sheet: 300ms;

  /* ── Layout ───────────────────────────────────── */
  --tabbar-h: 64px;
  --touch: 44px;
}

/* ── Reset + page stage ─────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#E7EAF0;
  font-family:var(--font-ui); color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  min-height:100vh; padding:28px 16px;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ── Stage header + device shell ────────────────── */
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.stage-head{width:min(402px,100%);display:flex;align-items:baseline;justify-content:space-between}
.wordmark{font-weight:800;font-size:21px;letter-spacing:-.03em}
.wordmark::first-letter{color:var(--accent)}
.stage-sub{font-size:var(--fs-micro);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-55);font-weight:600}
.device{
  width:402px;height:min(874px,calc(100vh - 118px));min-height:640px;
  background:var(--paper);
  border-radius:44px;
  box-shadow:0 30px 70px rgba(16,24,40,.20), inset 0 0 0 10px #FFFFFF, inset 0 0 0 11px #E3E7EE;
  overflow:hidden; position:relative; display:flex; flex-direction:column;
  padding:10px;
}
.device>*{border-radius:0}
@media (max-width:460px){
  body{padding:0;background:var(--paper)}
  .stage{gap:0;width:100%;height:100%}
  .stage-head,.stage-foot{display:none}
  .device{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;box-shadow:none;padding:0}
}
.statusbar{
  height:44px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13.5px;font-weight:600;letter-spacing:-.01em;
}
.statusbar svg{display:block}
.home-indicator{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);width:118px;height:4px;border-radius:2px;background:var(--ink);opacity:.85;pointer-events:none;z-index:60}
@media (max-width:460px){.home-indicator{bottom:7px}}
.stage-foot{width:min(402px,100%);font-size:12px;line-height:1.55;color:var(--ink-55)}
.stage-foot b{color:var(--ink);font-weight:600}

/* ── App scaffold ───────────────────────────────── */
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;font-size:var(--fs-body);line-height:1.5}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:screenIn var(--t-med) var(--ease)}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{display:none}

/* ── Legacy crosshair marks: retired in v2 ──────── */
i.rg{display:none}

/* ── Type utilities ─────────────────────────────── */
.eyebrow{font-size:var(--fs-micro);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--ink-55);font-weight:600}
.display{font-weight:700;letter-spacing:-.025em;line-height:1.12}
.num{font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.cap{font-size:var(--fs-caption);color:var(--ink-55)}
.body-s{font-size:var(--fs-body-s)}

/* ── App bar ────────────────────────────────────── */
.appbar{flex:none;display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-2) var(--sp-4) var(--sp-3);min-height:56px}
.appbar .titles{flex:1;min-width:0}
.appbar .titles .eyebrow{margin-bottom:1px}
.appbar h1{font-weight:700;font-size:var(--fs-h2);letter-spacing:-.02em;line-height:1.1}
.iconbtn{width:42px;height:42px;min-width:42px;display:flex;align-items:center;justify-content:center;background:var(--paper-raised);border:var(--hairline);border-radius:50%;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background var(--t-fast),transform var(--t-fast)}
.iconbtn:active{background:var(--paper-sunken);transform:scale(.95)}
.iconbtn.plain{background:transparent;border-color:transparent;box-shadow:none}
.badge-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--accent);border:2px solid var(--paper-raised);border-radius:50%}

/* ── Buttons ────────────────────────────────────── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  min-height:48px;padding:0 var(--sp-5);border-radius:var(--r-pill);
  font-size:var(--fs-body);font-weight:600;letter-spacing:-.01em;
  transition:background var(--t-fast),color var(--t-fast),border-color var(--t-fast),
             box-shadow var(--t-fast),transform var(--t-fast);
  user-select:none;
}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 16px rgba(45,95,240,.28)}
.btn-primary:active{background:var(--accent-deep)}
.btn-primary:disabled{background:var(--ink-25);box-shadow:none;cursor:not-allowed}
.btn-secondary{background:var(--paper-raised);border:1px solid var(--line-mid);box-shadow:0 1px 2px rgba(16,24,40,.04)}
.btn-secondary:active{background:var(--paper-sunken)}
.btn-danger-ghost{background:var(--paper-raised);border:1px solid rgba(222,68,68,.4);color:var(--danger)}
.btn-danger-ghost:active{background:var(--danger-tint)}
.btn-block{width:100%}

/* ── Sticky footer CTA ──────────────────────────── */
.footer{
  flex:none;padding:var(--sp-3) var(--sp-4) calc(var(--sp-4) + 12px);
  background:linear-gradient(to top,var(--paper) 74%,rgba(242,244,248,0));
  display:flex;flex-direction:column;gap:7px;position:relative;z-index:5;
}
.footer .hint{text-align:center;font-size:var(--fs-caption);color:var(--ink-55)}
.footer-row{display:flex;gap:var(--sp-2)}
.footer-row .btn{flex:1}

/* ── Cards + lists ──────────────────────────────── */
.card{background:var(--paper-raised);border:var(--hairline);border-radius:var(--r-card);box-shadow:var(--shadow-raised)}
.card-flat{background:var(--paper-raised);border:var(--hairline);border-radius:var(--r-card)}
.section-label{font-size:var(--fs-body-s);font-weight:700;letter-spacing:-.01em;color:var(--ink);padding:var(--sp-5) var(--sp-4) var(--sp-2);text-transform:none}
.list{border-top:0}
.row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-bottom:var(--hairline)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:var(--fs-body-s);letter-spacing:-.01em}
.row .amt{font-weight:700;font-size:14.5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}

/* merchant avatar circle */
.mav{width:40px;height:40px;min-width:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;letter-spacing:-.02em;color:#fff}

/* ── Chips + status ─────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-micro);font-weight:700;letter-spacing:.02em;text-transform:none;padding:4px 10px;border-radius:var(--r-pill);border:1px solid transparent;white-space:nowrap}
.chip-outline{background:var(--paper-raised);border-color:var(--line-mid);color:var(--ink-55)}
.chip-accent{background:var(--accent-tint);color:var(--accent-deep)}
.chip-ok{background:var(--ok-tint);color:var(--ok)}
.chip-warn{background:var(--warn-tint);color:var(--warn)}
.chip-danger{background:var(--danger-tint);color:var(--danger)}
.chip-muted{background:var(--paper-sunken);color:var(--ink-55);border-color:var(--line)}

/* ── Callouts / smart-check cards ───────────────── */
.callout{display:flex;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);border-radius:var(--r-card);border:var(--hairline);background:var(--paper-raised);font-size:var(--fs-body-s);line-height:1.5;color:var(--ink-70);box-shadow:0 1px 2px rgba(16,24,40,.03)}
.callout svg{flex:none;margin-top:1px}
.callout .ct{font-weight:700;color:var(--ink);margin-bottom:1px;letter-spacing:-.01em}
.callout .ico{width:34px;height:34px;min-width:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.callout-warn .ico{background:var(--warn-tint);color:var(--warn)}
.callout-danger .ico{background:var(--danger-tint);color:var(--danger)}
.callout-ok .ico{background:var(--ok-tint);color:var(--ok)}
.callout-info .ico{background:var(--violet-tint);color:var(--violet)}
.callout-warn svg,.callout-danger svg,.callout-ok svg,.callout-info svg{margin-top:0}

/* ── Forms ──────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--fs-caption);color:var(--ink-55);font-weight:600;letter-spacing:0;text-transform:none}
.field label .conf{color:var(--ok);font-weight:700}
.input,.selectlike,textarea.input{
  width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line-mid);
  border-radius:var(--r-input);background:var(--paper-raised);font-size:var(--fs-body);
  transition:border-color var(--t-fast),box-shadow var(--t-fast);
}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,95,240,.14);outline:none}
textarea.input{resize:none;line-height:1.5}
.selectlike{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);cursor:pointer;text-align:left}
select.input{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' fill='none' stroke='%23667085' stroke-width='1.8' stroke-linecap='round'><path d='M1 1l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
.readonly{background:var(--paper-sunken);color:var(--ink-70);border-color:var(--line)}

/* ── Segmented control (pill track) ─────────────── */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper-sunken);border:var(--hairline);border-radius:var(--r-pill);padding:4px;gap:2px}
.seg button{min-height:36px;font-size:12.5px;font-weight:600;color:var(--ink-55);border-radius:var(--r-pill);transition:background var(--t-fast),color var(--t-fast),box-shadow var(--t-fast)}
.seg button[aria-pressed="true"]{background:var(--paper-raised);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.10)}

/* ── Checkbox ───────────────────────────────────── */
.check{width:24px;height:24px;min-width:24px;border:1.5px solid var(--line-mid);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--paper-raised);transition:background var(--t-fast),border-color var(--t-fast)}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check svg{opacity:0;transform:scale(.6);transition:opacity var(--t-fast),transform var(--t-fast);color:#fff}
.check[aria-checked="true"] svg{opacity:1;transform:none}
.checkline{display:flex;gap:var(--sp-3);align-items:flex-start;cursor:pointer;text-align:left}

/* ── Tab bar ────────────────────────────────────── */
.tabbar{
  flex:none;height:var(--tabbar-h);display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper-raised);border-top:var(--hairline);
  border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(16,24,40,.07);
  padding:4px 6px 8px;position:relative;z-index:10;
}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-40);position:relative;border-radius:14px;transition:color var(--t-fast)}
.tab span{font-size:10px;font-weight:600;letter-spacing:0}
.tab[aria-current="true"]{color:var(--accent)}
.tab[aria-current="true"] span{font-weight:700}
.tab .tbadge{position:absolute;top:6px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid var(--paper-raised)}

/* ── Bottom sheet + scrim ───────────────────────── */
.scrim{position:absolute;inset:0;background:rgba(16,24,40,.44);z-index:40;animation:fadeIn var(--t-med) var(--ease)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:50;
  background:var(--paper-raised);border-radius:var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow:var(--shadow-sheet);padding:var(--sp-3) var(--sp-5) calc(var(--sp-6) + 8px);
  animation:sheetUp var(--t-sheet) var(--ease);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line-mid);margin:2px auto var(--sp-4)}
.sheet h2{font-weight:700;font-size:var(--fs-h2);letter-spacing:-.02em}

/* ── Toast ──────────────────────────────────────── */
.toast{
  position:absolute;left:var(--sp-5);right:var(--sp-5);bottom:calc(var(--tabbar-h) + 20px);z-index:55;
  background:var(--ink);color:#fff;border-radius:var(--r-pill);
  padding:13px 18px;font-size:var(--fs-body-s);font-weight:600;display:flex;gap:10px;align-items:center;
  box-shadow:var(--shadow-pop);animation:toastIn var(--t-med) var(--ease);
}
.toast.leaving{animation:toastOut var(--t-med) var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* ── Timeline ───────────────────────────────────── */
.tl{padding:var(--sp-1) var(--sp-4)}
.tl-item{display:flex;gap:var(--sp-3)}
.tl-rail{display:flex;flex-direction:column;align-items:center;width:14px;flex:none}
.tl-dot{width:12px;height:12px;border-radius:50%;border:2.5px solid;flex:none;margin-top:3px}
.tl-line{width:2px;flex:1;min-height:26px;border-radius:1px}
.tl-body{padding-bottom:var(--sp-4);flex:1}
.tl-body .t{font-weight:600;font-size:var(--fs-body-s)}
.tl-body .m{font-size:var(--fs-caption);color:var(--ink-55);margin-top:1px}

/* ── Hero (gradient balance card) ───────────────── */
.hero-card{
  margin:var(--sp-2) var(--sp-4) 0;padding:var(--sp-5) var(--sp-5) var(--sp-4);
  background:var(--accent-grad);color:#fff;border:0;border-radius:22px;
  box-shadow:0 12px 32px rgba(45,95,240,.35);position:relative;overflow:hidden;
}
.hero-card::after{content:'';position:absolute;top:-70px;right:-60px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero-card::before{content:'';position:absolute;bottom:-90px;left:-40px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hero-card .eyebrow{color:rgba(255,255,255,.8)}
.hero-amt{font-size:var(--fs-num-l);margin:5px 0 14px;letter-spacing:-.03em}
.hero-pill{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.24)}
.hero-actions{display:flex;gap:8px;position:relative;z-index:1}
.hero-actions .btn{min-height:42px;font-size:13px}
.hero-btn-solid{background:#fff;color:var(--accent-deep)}
.hero-btn-solid:active{background:#EDF1FE}
.hero-btn-ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.28)}
.hero-btn-ghost:active{background:rgba(255,255,255,.26)}
.hero-stats{display:flex;gap:18px;margin-top:14px;position:relative;z-index:1}
.hero-stats .n{font-weight:700;font-size:15px}
.hero-stats .l{font-size:var(--fs-caption);color:rgba(255,255,255,.75)}

/* ── Quick actions grid ─────────────────────────── */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 var(--sp-4)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 2px 4px}
.qa .qi{width:52px;height:52px;border-radius:18px;background:var(--paper-raised);border:var(--hairline);box-shadow:0 1px 2px rgba(16,24,40,.05);display:flex;align-items:center;justify-content:center;color:var(--accent);transition:transform var(--t-fast),background var(--t-fast)}
.qa button:active .qi{transform:scale(.93);background:var(--accent-tint)}
.qa span{font-size:11px;font-weight:600;color:var(--ink-70)}

/* ── Screen-specific bits ───────────────────────── */
.scan-stage{flex:1;display:flex;align-items:center;justify-content:center;background:#0C1222;position:relative}
.scan-frame{width:270px;height:380px;position:relative;display:flex;align-items:center;justify-content:center;border-radius:22px;border:1.5px dashed rgba(255,255,255,.35)}
.scan-frame .rg{display:none}
.scan-hint{color:rgba(255,255,255,.75);font-size:var(--fs-body-s);text-align:center;line-height:1.6;letter-spacing:.01em}
.scan-line{position:absolute;left:14px;right:14px;height:2.5px;background:linear-gradient(90deg,transparent,#6E96F8,transparent);animation:scanSweep 1.4s ease-in-out infinite;border-radius:2px}
@keyframes scanSweep{0%,100%{top:10%}50%{top:88%}}
.shutter{width:68px;height:68px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center}
.shutter i{width:52px;height:52px;border-radius:50%;background:var(--accent);transition:transform var(--t-fast)}
.shutter:active i{transform:scale(.88)}

.kv{display:flex;justify-content:space-between;gap:var(--sp-3);padding:10px 0;border-bottom:var(--hairline);font-size:var(--fs-body-s)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-55)}
.kv .v{font-weight:600;text-align:right;letter-spacing:-.01em}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2)}
.compare .card-flat{padding:var(--sp-4)}

/* ── navigation ── */
function go(screen, push=true){
  if (push && screen !== S.screen) S.stack.push(S.screen);
  S.screen = screen; S.sheet = null;
  render();
}
function back(){
  S.screen = S.stack.pop() || 'home'; S.sheet = null;
  render();
}
function toast(msg){
  clearTimeout(S.toastTimer);
  S.toastMsg = msg; render();
  S.toastTimer = setTimeout(()=>{
    const el = document.querySelector('.toast');
    if (el){ el.classList.add('leaving'); setTimeout(()=>{ S.toastMsg=null; render(); }, 200); }
    else { S.toastMsg=null; }
  }, 2600);
}

/* ════════════════ SHARED PARTIALS ════════════════ */
const AV_COLORS = ['#2D5FF0','#7A5AF8','#0FA47A','#E0731D','#D6456B','#1193C2'];
const mav = name => {
  const initials = name.replace(/[^A-Za-z ]/g,'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '•';
  let h = 0; for (const ch of name) h = (h*31 + ch.charCodeAt(0)) % AV_COLORS.length;
  return `<span class="mav" style="background:${AV_COLORS[h]}">${initials}</span>`;
};

const flagChip = f =>
  f==='exception' ? `<span class="chip chip-warn">${ic.warn(11)} Exception</span>` :
  f==='duplicate' ? `<span class="chip chip-danger">${ic.copy(11)} Duplicate</span>` : '';

      <div class="kv"><span class="k">Engagement</span><span class="v">FY26 Statutory Audit</span></div>
      <div class="kv"><span class="k">Classification</span><span class="v">Client billable · \u20B95,700 of \u20B96,880</span></div>

/* ── NOTIFICATIONS ── */

  ${appbarBack('All caught up after this','Notifications')}

      ${DB.notifs.map(n=>`

          <span class="mav" style="width:38px;height:38px;min-width:38px;background:${n.unread&&!S.notifsRead?'var(--accent)':'var(--paper-sunken)'};color:${n.unread&&!S.notifsRead?'#fff':'var(--ink-55)'}">${ic.bell(16)}</span>
          <div class="grow">

/* ════════════════ RENDER + EVENTS ════════════════ */
const MAIN = ['home','expenses','claims','approvals','profile'];

function sheetHTML(){
  if (!S.sheet) return '';
  const needReason = S.sheet!=='approve';
  const title = S.sheet==='approve'?'Approve claim':S.sheet==='return'?'Return for correction':'Reject claim';
  const ok = !needReason || S.reason.trim().length>0;
  return `
  <div class="scrim" data-act="closeSheet"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
    <div class="grab"></div>
    <h2>${title}</h2>
    <div class="cap" style="margin-top:3px">CLM-2026-0142 · Rohit Menon · \u20B96,880</div>
    ${needReason?`
    <div class="field" style="margin-top:16px">
      <label>Reason · required</label>
      <textarea class="input" rows="3" placeholder="Tell the employee what to correct" data-bind="reason">${S.reason}</textarea>
    </div>`:`
    <div class="callout callout-ok" style="margin-top:16px">
      ${ic.check(15)}
      <span>Approving routes this claim to Finance verification. The policy exception and its justification stay on the audit trail.</span>
    </div>`}
    <div class="footer-row" style="margin-top:18px">
      <button class="btn btn-secondary" data-act="closeSheet">Cancel</button>
      <button class="btn ${S.sheet==='reject'?'btn-danger-ghost':'btn-primary'}" data-act="confirmSheet" ${ok?'':'disabled'}>Confirm</button>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  const focused = document.activeElement;
  const bindKey = focused && focused.dataset ? focused.dataset.bind : null;
  const selStart = bindKey && focused.selectionStart != null ? focused.selectionStart : null;

  app.innerHTML = `
    <div class="screen" data-screen="${S.screen}">${V[S.screen]()}</div>
    ${MAIN.includes(S.screen) ? tabbar() : ''}
    ${sheetHTML()}
    ${S.toastMsg ? `<div class="toast" role="status">${ic.check(15)} ${S.toastMsg}</div>` : ''}
  `;

  if (bindKey){
    const el = app.querySelector(`[data-bind="${bindKey}"]`);
    if (el){ el.focus(); if (selStart!=null && el.setSelectionRange) try{ el.setSelectionRange(selStart,selStart); }catch(e){} }
  }
}

function setPath(path, val){
  const parts = path.split('.');
  let o = S;
  while (parts.length>1) o = o[parts.shift()];
  o[parts[0]] = val;
}

document.getElementById('app').addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'go': go(el.dataset.to); break;
    case 'tab': S.stack=[]; go(el.dataset.to, false); break;
    case 'back': back(); break;
    case 'backToApprovals': go('approvals', false); break;
    case 'toggle': {
      const id = el.dataset.id;
      const i = S.selected.indexOf(id);
      i>=0 ? S.selected.splice(i,1) : S.selected.push(id);
      render(); break;
    }
    case 'decl': S.decl = !S.decl; render(); break;
    case 'mcls': S.m.cls = el.dataset.v; render(); break;
    case 'milecls': S.mile.cls = el.dataset.v; render(); break;
    case 'capture':
      if (S.scan==='busy') break;
      S.scan='busy'; render();
      setTimeout(()=>{ S.scan='idle'; go('ocr'); }, 1600);
      break;
    case 'saveOcr': go('expenses', false); S.stack=[]; toast('Expense saved · within policy'); break;
    case 'draftSave': back(); toast('Draft saved'); break;
    case 'saveManual': go('expenses', false); S.stack=[]; toast('Expense saved'); break;
    case 'saveMileage': go('expenses', false); S.stack=[]; toast(`Mileage saved · ${fmt(Math.round((parseFloat(S.dist)||0)*12))}`); break;
    case 'saveException': back(); toast('Justification saved — a Partner will co-approve'); break;
    case 'dropDup': S.removed.push('E-4809'); S.dupResolved=true; S.selected=S.selected.filter(x=>x!=='E-4809'); go('expenses', false); toast('Expense E-4809 discarded'); break;
    case 'keepDup': S.dupResolved=true; go('expenses', false); toast('Kept · flag and note stay on the audit trail'); break;
    case 'submitClaim': S.submitted=true; go('claims', false); S.stack=[]; toast('Claim submitted · with R. Deshpande'); break;
    case 'sheet': S.sheet = el.dataset.v; S.reason=''; render(); break;
    case 'closeSheet': S.sheet=null; render(); break;
    case 'confirmSheet': {
      S.decided = S.sheet; S.sheet=null;
      go('approvals', false);
      break;
    }
    case 'toastMsg': toast(el.dataset.msg); break;
  }
});

document.getElementById('app').addEventListener('input', ev => {
  const el = ev.target.closest('[data-bind]');
  if (!el) return;
  setPath(el.dataset.bind, el.value);
  // Re-render only when dependent UI must update (counters, totals, disabled states)
  const live = ['just','m.amount','m.merchant','m.purpose','dist','reason'];
  if (live.includes(el.dataset.bind)) render();
});
document.getElementById('app').addEventListener('change', ev => {
  const el = ev.target.closest('select[data-bind]');
  if (el){ setPath(el.dataset.bind, el.value); }
});

/* mark notifications read when the screen is visited */
const _go = go;
go = function(screen, push){
  if (screen==='notifs') setTimeout(()=>{ S.notifsRead = true; }, 600);
  _go(screen, push);
};

render();
</script>
